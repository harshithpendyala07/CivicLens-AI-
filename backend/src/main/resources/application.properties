# ============================================================
# CivicLens AI — Active Configuration (Flagsmith Hackathon)
# ============================================================
spring.application.name=civiclens-api
server.port=8080

# --- Default Database: In-memory H2 with MySQL mode (Zero setup required for demo/evaluation) ---
spring.datasource.url=jdbc:h2:mem:civiclensdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- Production MySQL Configuration (Uncomment when MySQL is running) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/civiclens_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:root}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT Configuration (Security hardened with environment variable override) ---
jwt.secret=${JWT_SECRET:CivicLensAI_Flagsmith_Hackathon_SuperSecret_JWT_Key_2026}
jwt.expiration=86400000

# --- File Upload Configuration ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# --- Gemini AI Configuration ---
# Gemini API Key (Uses gemini-3.8-flash for high-accuracy multimodal visual inspection)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.8-flash

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://harshith.embarko.app

# --- Logging ---
logging.level.com.civiclens=INFO
logging.level.org.springframework.security=WARN
